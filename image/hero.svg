<!-- Save as docs/public/hero.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Zephyr AI hero">
  <defs>
    <linearGradient id="gradA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5ee7df"/>
      <stop offset="1" stop-color="#7a7cff"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f3f7ff" stop-opacity="0.98"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#2b6edb" flood-opacity="0.12"/>
    </filter>

    <radialGradient id="glow" cx="0.7" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#8bbdff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b6a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background glow -->
  <rect x="0" y="0" width="900" height="600" fill="url(#glow)"/>

  <!-- tilted card group -->
  <g transform="translate(410,300) rotate(-20)">

    <!-- shadow plate -->
    <rect x="-180" y="-120" width="360" height="240" rx="26"
      fill="#203449"
      transform="translate(16,22)"
      opacity="0.12" />

    <!-- main card -->
    <rect x="-180" y="-120" width="360" height="240" rx="26"
      fill="url(#cardGrad)"
      filter="url(#softShadow)"/>

    <!-- gradient border -->
    <rect x="-176" y="-116" width="352" height="232" rx="22"
      fill="none"
      stroke="url(#gradA)"
      stroke-width="6"
      opacity="0.95"/>

    <!-- inner panel -->
    <g transform="translate(-60,-30) scale(1.1)">

      <rect x="-12" y="-6" width="144" height="108" rx="14"
        fill="white"
        opacity="0.98" />

      <rect x="-12" y="-6" width="144" height="108" rx="14"
        fill="none"
        stroke="#e6eefc"
        stroke-width="2" />

      <!-- AI brain icon -->
      <g transform="translate(18,10)">
        <rect x="0" y="0" width="56" height="56" rx="12"
          fill="url(#gradA)"/>

        <circle cx="20" cy="24" r="4" fill="white"/>
        <circle cx="36" cy="18" r="4" fill="white"/>
        <circle cx="34" cy="34" r="4" fill="white"/>
        <circle cx="18" cy="36" r="4" fill="white"/>

        <line x1="20" y1="24" x2="36" y2="18" stroke="white" stroke-width="2"/>
        <line x1="20" y1="24" x2="18" y2="36" stroke="white" stroke-width="2"/>
        <line x1="18" y1="36" x2="34" y2="34" stroke="white" stroke-width="2"/>
        <line x1="34" y1="34" x2="36" y2="18" stroke="white" stroke-width="2"/>
      </g>

      <!-- chat bubble -->
      <g transform="translate(96,18)">
        <rect x="0" y="0" width="36" height="36" rx="8"
          fill="#eef5ff"/>

        <path d="M10 12 H26 M10 18 H22 M10 24 H18"
          stroke="#4f6bff"
          stroke-width="2"
          stroke-linecap="round"/>
      </g>

      <!-- workflow lines -->
      <circle cx="26" cy="84" r="4" fill="#7a7cff"/>
      <circle cx="56" cy="84" r="4" fill="#7a7cff"/>
      <circle cx="86" cy="84" r="4" fill="#7a7cff"/>

      <line x1="26" y1="84" x2="56" y2="84" stroke="#7a7cff" stroke-width="2"/>
      <line x1="56" y1="84" x2="86" y2="84" stroke="#7a7cff" stroke-width="2"/>

    </g>
  </g>

  <!-- accent orb -->
  <circle cx="740" cy="180" r="72" fill="url(#gradA)" opacity="0.08"/>
</svg>