<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 64 64"
width="64"
height="64"
role="img"
aria-label="Zephyr AI Logo">

  <defs>
    <!-- hero 同款渐变 -->
    <linearGradient id="gradA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6fb5ff"/>
      <stop offset="100%" stop-color="#8b6bff"/>
    </linearGradient>
  </defs>

  <!-- 轻微旋转卡片 -->
  <g transform="rotate(-12 32 32)">

    <!-- 主卡片 -->
    <rect
      x="12"
      y="12"
      width="40"
      height="40"
      rx="10"
      fill="white"
      stroke="url(#gradA)"
      stroke-width="3"
    />

    <!-- Markdown 标识 -->
    <text
      x="32"
      y="37"
      font-family="Segoe UI, Roboto, PingFang SC, sans-serif"
      font-size="16"
      text-anchor="middle"
      fill="#3b82f6"
      font-weight="700">
      M↓
    </text>

  </g>

</svg>